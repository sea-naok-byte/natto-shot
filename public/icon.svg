<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- 背景の丸(やさしいクリーム色) -->
  <circle cx="50" cy="50" r="48" fill="#fdeee0"/>
  <circle cx="50" cy="50" r="48" fill="none" stroke="#f4d9bd" stroke-width="2"/>

  <!-- 肩・法衣 -->
  <path d="M18 90 Q18 62 50 60 Q82 62 82 90 Z" fill="#c99a5b"/>
  <path d="M50 60 Q40 66 36 90 L44 90 Q46 72 50 66 Q54 72 56 90 L64 90 Q60 66 50 60 Z" fill="#b8894c"/>

  <!-- 首 -->
  <rect x="44" y="52" width="12" height="14" rx="4" fill="#e7be86"/>

  <!-- 耳(福耳) -->
  <path d="M26 42 Q18 46 20 58 Q22 66 30 64 Q26 54 30 44 Z" fill="#e7be86"/>
  <path d="M74 42 Q82 46 80 58 Q78 66 70 64 Q74 54 70 44 Z" fill="#e7be86"/>

  <!-- 顔 -->
  <circle cx="50" cy="42" r="26" fill="#eec48f"/>

  <!-- 螺髪(頭の粒) -->
  <circle cx="50" cy="17" r="7" fill="#8a5a2b"/>
  <g fill="#8a5a2b">
    <circle cx="34" cy="21" r="3"/>
    <circle cx="41" cy="16" r="3"/>
    <circle cx="50" cy="14" r="3"/>
    <circle cx="59" cy="16" r="3"/>
    <circle cx="66" cy="21" r="3"/>
    <circle cx="29" cy="28" r="3"/>
    <circle cx="71" cy="28" r="3"/>
  </g>

  <!-- 白毫(眉間の点) -->
  <circle cx="50" cy="38" r="1.6" fill="#8a5a2b"/>

  <!-- 目(やさしく閉じた目) -->
  <path d="M37 42 Q41 45 45 42" stroke="#6b4423" stroke-width="2" fill="none" stroke-linecap="round"/>
  <path d="M55 42 Q59 45 63 42" stroke="#6b4423" stroke-width="2" fill="none" stroke-linecap="round"/>

  <!-- ほお -->
  <circle cx="36" cy="49" r="4" fill="#f6a89a" opacity="0.55"/>
  <circle cx="64" cy="49" r="4" fill="#f6a89a" opacity="0.55"/>

  <!-- 口(にっこり) -->
  <path d="M43 53 Q50 59 57 53" stroke="#6b4423" stroke-width="2" fill="none" stroke-linecap="round"/>
</svg>
